# Drop-in da unit monitor-ritapolis.service (a unit em si só existe na VM).
# Instalação: ver "Reinício automático da API" em docs/DEPLOY.md.
#
# Em 28/09/2026 o processo da API caiu ~15:33 UTC e ficou ~10h fora (Caddy
# respondendo 502) até um restart manual. Com isto o systemd sobe de novo
# sozinho quando o processo morre (crash, OOM kill, exit inesperado).
#
# `systemctl stop` (deploy.sh, disjuntor do R2) NÃO dispara o restart: o
# systemd só reinicia saídas que ele não pediu.

[Unit]
# Sem limite de tentativas: melhor insistir a cada 10s do que desistir e
# deixar a API fora até alguém notar.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
