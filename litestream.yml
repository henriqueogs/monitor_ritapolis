exec: node scripts/api.js

logging:
  level: info
  type: text
  stderr: false

# Uma fotografia completa por dia, mantendo tres dias. Entre fotografias,
# somente paginas alteradas do SQLite sao enviadas ao R2.
snapshot:
  interval: 24h
  retention: 72h

# Backup de um acervo municipal de baixo volume, nao replicacao em tempo real.
# monitor-interval agrupa as paginas alteradas ANTES de gerar arquivos L0;
# aumentar apenas sync-interval nao reduz a quantidade de objetos enviados.
levels:
  - interval: 1h
  - interval: 6h
  - interval: 24h

# A API le o banco persistente da VM, nao o R2. Limpeza sem polling continuo;
# o Litestream so remove incrementais cobertos por compactacao.
l0-retention: 30m
l0-retention-check-interval: 15m

# A limpeza remota continua habilitada. O bucket nao deve crescer sem limite.
retention:
  enabled: true

validation:
  interval: 24h

verify-compaction: true

dbs:
  - path: ${DB_PATH}
    # Janela nominal de recuperacao: 15m + envio/processamento/rede. Edicoes
    # administrativas recentes nao devem ser consideradas protegidas antes do envio.
    monitor-interval: 15m
    checkpoint-interval: 15m
    busy-timeout: 15s
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: replicas/ritapolis-v2
      endpoint: ${R2_ENDPOINT}
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      sync-interval: 1m
