<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ritápolis.com">
  <!-- Ícone simplificado derivado da logo (perfil de Tiradentes + barras de
       dados). Versão glifo pra favicon/app-icon; a lockup horizontal completa
       fica no PNG oficial. Azul da marca #1b3af0. -->
  <rect width="64" height="64" rx="14" fill="#1b3af0"/>
  <g fill="#ffffff">
    <!-- Perfil estilizado (testa, nariz, barba) em silhueta -->
    <path d="M20 15
             c-4 2 -6 6 -6 11
             c0 3 -1 4 -3 6
             c-1 1 -1 2 1 2
             l3 0
             l0 4
             c0 5 3 9 8 10
             l0 -33
             c0 -6 -1 -11 -3 -11 z"/>
    <!-- Barras de dados (o lado analítico) -->
    <rect x="30" y="30" width="4" height="19" rx="1"/>
    <rect x="37" y="22" width="4" height="27" rx="1"/>
    <rect x="44" y="34" width="4" height="15" rx="1"/>
  </g>
</svg>
