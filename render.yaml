services:
  - type: web
    name: monitor-ritapolis-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - frontend/**
    buildCommand: >-
      npm ci &&
      mkdir -p .render/bin /tmp/litestream-install &&
      curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.5.14/litestream-0.5.14-linux-x86_64.tar.gz -o /tmp/litestream-install/litestream.tar.gz &&
      echo "32083dd2af13840b273c538360b828368d7b82bbaa2c641106052dc7814ed956  /tmp/litestream-install/litestream.tar.gz" | sha256sum -c - &&
      tar -xzf /tmp/litestream-install/litestream.tar.gz -C .render/bin &&
      chmod +x .render/bin/litestream
    startCommand: >-
      mkdir -p /tmp/monitor-ritapolis/logs &&
      exec node scripts/render-start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: API_HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /tmp/monitor-ritapolis/ritapolis.db
      - key: LOG_DIR
        value: /tmp/monitor-ritapolis/logs
      - key: RENDER_HANDOFF_DELAY_MS
        value: '105000'
      - key: R2_RESTORE_REQUIRED
        value: 'true'
      - key: R2_ENDPOINT
        value: https://82e6e66e2415b802e2825c4729911a68.r2.cloudflarestorage.com
      - key: R2_BUCKET
        value: monitor-ritapolis-private
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BACKUP_INTERVAL_HOURS
        value: '24'
      - key: R2_FULL_BACKUP_ENABLED
        value: 'false'
      - key: R2_MAX_BACKUP_BYTES
        value: '1000000000'
      - key: R2_USAGE_GUARD_REQUIRED
        value: 'true'
      - key: R2_MAX_STORAGE_BYTES
        value: '8000000000'
      - key: R2_MAX_CLASS_A_OPS
        value: '800000'
      - key: R2_MAX_CLASS_B_OPS
        value: '8000000'
      - key: R2_BILLING_CYCLE_DAY
        value: '12'
      - key: CLOUDFLARE_ACCOUNT_ID
        value: 82e6e66e2415b802e2825c4729911a68
      - key: COLLECTOR_PROXY_URL
        value: https://monitor-ritapolis-heartbeat.henriqueguimaraes.workers.dev/proxy
      - key: COLLECTOR_PROXY_TOKEN
        sync: false
      - key: DESCOBERTAS_SCHEDULER_ENABLED
        value: 'false'
      - key: DESCOBERTAS_INVESTIGACAO_SCHEDULER_ENABLED
        value: 'false'
      - key: FRONTEND_URL
        value: https://ritapolis.com
      - key: PUBLIC_SITE_URL
        value: https://ritapolis.com
      - key: ALLOWED_ORIGINS
        value: https://ritapolis.com,https://www.ritapolis.com,https://monitor-ritapolis.vercel.app
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
