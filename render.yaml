services:
  - type: web
    name: monitor-ritapolis-api
    runtime: node
    plan: starter
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: npm ci
    startCommand: npm run api
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    disk:
      name: monitor-ritapolis-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/ritapolis.db
      - key: LOG_DIR
        value: /var/data/logs
      - key: R2_RESTORE_REQUIRED
        value: "true"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
