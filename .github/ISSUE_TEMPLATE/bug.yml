name: Erro no sistema
description: Algo quebrou na instalação, na coleta, na IA ou no site.
labels: ['bug']
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: O erro, a mensagem e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. npm run ...
        2. ...
    validations:
      required: true
  - type: input
    id: municipio
    attributes:
      label: Município (valor de MUNICIPIO)
      placeholder: ritapolis
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Versão do Node, sistema, Docker ou não.
      placeholder: Node 24.x, Ubuntu 24.04, docker compose
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Trecho relevante. Apague chaves, tokens e dados pessoais antes de colar.
      render: text
