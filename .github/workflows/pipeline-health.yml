name: Pipeline health (IA)

# Falha (e o GitHub avisa por e-mail) quando a IA para de resumir: o único
# check antes era de capacidade da VM, que ficou verde enquanto documentos
# de 28/08 em diante ficavam sem leitura simples. A cada 6h: durante a campanha
# de resumos históricos (docs/CAMPANHA_RESUMOS_HISTORICOS.md) 429 e fila parada
# precisam aparecer no mesmo dia.
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Consultar saúde do pipeline
        run: |
          curl -fsS --retry 3 --retry-delay 10 https://api.ritapolis.com/api/saude/pipeline \
            | node scripts/check-pipeline-health.js
