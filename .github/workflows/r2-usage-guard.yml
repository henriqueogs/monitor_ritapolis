name: R2 usage guard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-usage-guard
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar franquia do R2
        id: guard
        continue-on-error: true
        run: node scripts/check-r2-usage.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_BILLING_CYCLE_DAY: ${{ vars.R2_BILLING_CYCLE_DAY }}
          R2_MAX_STORAGE_BYTES: '8000000000'
          R2_MAX_CLASS_A_OPS: '800000'
          R2_MAX_CLASS_B_OPS: '8000000'
      - name: Parar API preventivamente (disjuntor)
        if: steps.guard.outcome == 'failure'
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/cb_key
          chmod 600 ~/.ssh/cb_key
          ssh -i ~/.ssh/cb_key -o StrictHostKeyChecking=accept-new "ubuntu@${SSH_HOST}"
        env:
          SSH_KEY: ${{ secrets.ORACLE_CIRCUIT_BREAKER_SSH_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_DEPLOY_HOST }}
      - name: Falhar verificacao apos acionar o disjuntor
        if: steps.guard.outcome == 'failure'
        run: exit 1
