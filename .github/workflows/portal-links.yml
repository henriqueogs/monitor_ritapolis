name: Portal links (deep-links)

# Semanal: confere se os links "Abrir no portal" (Detalhamento_Despesa.php) ainda
# abrem o empenho certo. Falha (e o GitHub avisa por e-mail) se o portal mudar o
# contrato de URL. Roda no GitHub, não na VM: o portal bloqueia o IP da Oracle (403).
on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-portal-links.js
