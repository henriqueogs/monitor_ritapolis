name: Portal links (deep-links)

# Confere se os links "Abrir no portal" (Detalhamento_Despesa.php) ainda abrem o
# empenho certo. SOMENTE MANUAL: o portal responde 403 a IPs de datacenter (a VM
# Oracle e os runners do GitHub, confirmado em 07/10/2026), entao um agendamento
# aqui geraria falso alarme toda semana. De uma rede residencial passa 12/12:
#   node scripts/check-portal-links.js
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-portal-links.js
